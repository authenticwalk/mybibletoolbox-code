total_non_arbitrary_percentage: 25
breakdown:
  theological_critical: 15  # Great Commission, Covenant promises, Ten Commandments, Prophecies, Christological assertions
  contextual_essential: 10  # Rhetorical questions, warnings vs threats, appeals vs commands, parable warnings

total_arbitrary_percentage: 75
note: |
  Illocutionary force is usually contextually obvious (75% of cases), but
  misidentification in critical contexts (25%) leads to major doctrinal/pastoral errors:

  CRITICAL THEOLOGICAL CONTEXTS (15%):
  1. Commands vs. suggestions (Great Commission, Ten Commandments)
     - Wrong force = undermines authority, creates optional obedience
  2. Promises vs. conditional statements (Covenant promises)
     - Wrong force = uncertain salvation, questions God's faithfulness
  3. Declarations vs. opinions (Christological assertions, prophecies)
     - Wrong force = relativizes truth, weakens apologetics
  4. Blessings vs. wishes (Aaronic blessing, Beatitudes)
     - Wrong force = sentimental vs. performative, law vs. grace

  CONTEXTUAL ESSENTIAL (10%):
  5. Rhetorical vs. information questions (Paul's diatribe)
     - Wrong force = appears to entertain heresy
  6. Warnings vs. threats (Prophetic warnings)
     - Wrong force = vindictive God vs. redemptive
  7. Requests vs. commands (Philemon appeal)
     - Wrong force = misses pastoral sensitivity
  8. Teaching vs. warning (Parable conclusions)
     - Wrong force = loses urgency

  PASTORAL IMPACT:
  - Commands as suggestions = weakened discipleship, optional obedience
  - Promises as conditionals = insecurity, fear, uncertainty
  - Warnings as threats = wrong view of God (vindictive vs. loving)
  - Assertions as opinions = relativism, weakened apologetics
  - Rhetorical questions as genuine = appears to entertain heresy

  TRANSLATION PRIORITY:
  High-stakes contexts require 100% accuracy. Arbitrary contexts (75%) can
  rely on natural target language conventions without special analysis.

