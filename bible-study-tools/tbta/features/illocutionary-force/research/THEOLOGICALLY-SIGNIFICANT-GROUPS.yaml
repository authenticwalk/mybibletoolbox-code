theological_perspective: conservative_protestant_christian
note_on_perspective: |
  This analysis reflects conservative Protestant orthodoxy as specified in
  CLAUDE.md. Key distinctives affecting illocutionary force analysis:

  - Biblical authority: Commands in Scripture are binding (not mere suggestions)
  - Propositional revelation: Scripture makes truth claims (not opinions)
  - God's faithfulness: Covenant promises are certain (not conditional)
  - Completed atonement: "It is finished" is declaration (not ongoing)

  Other Christian traditions (Catholic, Orthodox) largely agree on illocutionary
  force classifications for high-stakes texts (commands, promises, declarations),
  with some differences in application hermeneutics.

recommendations_for_algorithm:
