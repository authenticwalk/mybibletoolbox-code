  - Crucifixion: Both human agents (guilt) and divine plan (sovereignty)
  - Logos: "The Word" as christological title (not generic reference)
  - Trinity: Clear participant tracking (Father/Son/Spirit distinct)

  Denominational variations:
  - Protestant/Catholic/Orthodox: Unified on Holy Spirit personhood
  - All affirm divine agency in resurrection (passive or explicit)
  - All affirm both human guilt and divine plan in crucifixion
  - Minor variations in pneumatology terminology, substance identical

