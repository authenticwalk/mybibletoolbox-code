  - priority_4: Track Logos references - maintain noun "the Word" at key points (not just pronouns)
  - priority_5: Mark emphatic pronouns (Greek/Hebrew) - preserve emphasis even in pro-drop targets
  - priority_6: Aid messianic prophecy clarity (strategic noun use for individual servant identification)
  - priority_7: Maintain participant clarity in complex contexts (Gen 18 - distinguish LORD from angels)
  - priority_8: Preserve formal declarations (divine voice, testimony) with nouns not casual pronouns
