breakdown:
  theological_critical: 10  # Divine passive, Holy Spirit personhood, crucifixion agency, Logos, messianic ID
  contextual_essential: 5   # Participant clarity, divine voice, formal declarations

total_arbitrary_percentage: 85
note: |
  Surface realization is MOSTLY stylistic (85% of cases), following natural
  discourse flow and language-specific conventions (pro-drop vs. non-pro-drop).

  CRITICAL exceptions (15%) involve:

  THEOLOGICAL CRITICAL (10%):
  1. Divine passive (resurrection, theological passive)
     - Wrong realization = obscures divine agency or over-specifies
  2. Holy Spirit personhood (personal pronouns vs. neuter/zero)
     - Wrong realization = suggests impersonal force (heretical)
  3. Crucifixion agency (active vs. passive, human vs. divine)
     - Wrong realization = imbalanced theology (guilt only or sovereignty only)
  4. Jesus's authority claims (emphatic pronouns vs. divine passive contrast)
     - Wrong realization = weakens christological weight
  5. Logos theology (noun "the Word" vs. pronouns)
     - Wrong realization = obscures christological title
  6. Messianic prophecy clarity (noun restaging aids identification)
     - Wrong realization = blurs messianic reading

  CONTEXTUAL ESSENTIAL (5%):
  7. Participant tracking in complex contexts (Gen 18 - LORD + angels)
     - Wrong realization = reader confusion about participants
  8. Divine testimony (formal nouns vs. casual pronouns)
     - Wrong realization = loses solemnity
  9. Identity revelations (explicit nouns vs. pronouns)
     - Wrong realization = weakens dramatic disclosure

  PASTORAL IMPACT:
  - Divine passive as active = obscures God's agency in resurrection
  - Holy Spirit as "it" = heretical impersonal force (Jehovah's Witnesses)
  - Excessive zero = obscures participant identity (Trinity, messianic prophecy)
  - Imbalanced crucifixion agency = either eliminates human guilt or divine plan

  PRO-DROP SENSITIVITY:
  - Pro-drop languages (70% of world) routinely use zero subjects
  - This is NATURAL and GRAMMATICAL, not theologically problematic
  - Exceptions: Holy Spirit must maintain personhood markers even in pro-drop
  - Divine passive maintains reverent zero agent (implies God) in pro-drop

  TRANSLATION PRIORITY:
  High-stakes contexts (15%) require careful attention to surface realization
  for theological clarity. Arbitrary contexts (85%) follow natural language
  discourse flow without special theological analysis.

