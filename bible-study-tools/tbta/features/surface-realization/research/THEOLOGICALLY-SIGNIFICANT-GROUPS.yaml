  This analysis reflects conservative Protestant orthodoxy as specified in
  CLAUDE.md. Key distinctives affecting surface-realization analysis:

  - Divine passive: Reverent way to imply God as agent without naming
  - Holy Spirit personhood: MUST use personal markers (not "it" - heretical)
