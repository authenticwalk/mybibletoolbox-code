sampling_notes: |
  - Most Agent-like and Most Patient-like are dominant (80% of data)
  - Destination and State are substantial minorities (9.1% and 7.5%)
  - Remaining roles are rare (< 2% each): Source, Beneficiary, Addressee, Instrument
  - For balanced dataset: oversample rare values, undersample common values
  - Target: ~800 train + ~100 validate + ~100 test = ~1000 total entries
  - Suggested per-value targets:
    - Agent/Patient: 250-300 each (many examples available)
    - Destination/State: 100-120 each (sufficient examples)
    - Source/Beneficiary/Addressee/Instrument: 50-80 each (use most/all available)
