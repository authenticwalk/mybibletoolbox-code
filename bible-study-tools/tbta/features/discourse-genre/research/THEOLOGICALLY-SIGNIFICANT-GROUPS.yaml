note: |
  Genre identification is contextually obvious in majority of Scripture.
  Critical exceptions occur at theological flashpoints:
  1. Creation account historicity (Genesis 1-2)
  2. Gospel historicity (resurrection, miracles)
  3. OT narrative historicity (Jonah, Job)
  4. Apocalyptic vs literal prophecy (Revelation, Daniel)
  5. Poetry vs literal (Psalms, Song of Solomon)
  6. Wisdom literature proper application (Proverbs, Ecclesiastes)

  Wrong genre identification at these points leads to:
  - Doctrinal error (denying resurrection, original sin, etc.)
  - Misapplication (treating proverbs as promises)
  - False expectations (prosperity gospel from proverbs)
  - Interpretive confusion (literal apocalyptic symbols)

